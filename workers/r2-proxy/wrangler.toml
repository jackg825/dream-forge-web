name = "dream-forge-r2-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# R2 Bucket 綁定
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "dream-forge-storage"

# Native rate limit bindings. Each namespace ID is unique within the account.
[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "6699801"
simple = { limit = 200, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "6699802"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "DOWNLOAD_RATE_LIMITER"
namespace_id = "6699803"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "PRESIGN_RATE_LIMITER"
namespace_id = "6699804"
simple = { limit = 50, period = 60 }

# 環境變數
[vars]
ALLOWED_ORIGINS = "https://dreamforge.app,https://www.dreamforge.app,https://dreamforge-66998.web.app,https://dream-forge-r2-proxy.jackg825.workers.dev,https://dreamforge.kimi.tw,http://localhost:3000,http://localhost:5173"
FIREBASE_PROJECT_ID = "dreamforge-66998"

# 生產環境設定
[env.production]
name = "dream-forge-r2-proxy"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "dream-forge-storage"

[[env.production.ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "6699801"
simple = { limit = 200, period = 60 }

[[env.production.ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "6699802"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "DOWNLOAD_RATE_LIMITER"
namespace_id = "6699803"
simple = { limit = 100, period = 60 }

[[env.production.ratelimits]]
name = "PRESIGN_RATE_LIMITER"
namespace_id = "6699804"
simple = { limit = 50, period = 60 }

[env.production.vars]
ALLOWED_ORIGINS = "https://dreamforge.app,https://www.dreamforge.app,https://dreamforge-66998.web.app,https://dream-forge-r2-proxy.jackg825.workers.dev,https://dreamforge.kimi.tw,http://localhost:3000,http://localhost:5173"
FIREBASE_PROJECT_ID = "dreamforge-66998"

# 開發環境設定
[env.development]
name = "dream-forge-r2-proxy-dev"
